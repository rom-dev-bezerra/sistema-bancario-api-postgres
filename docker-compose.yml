version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: postgres-banco-central
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: bancocentral
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
